<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Ads - T-Mobile Ad System</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .my-ads-container {
            max-width: 1400px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .page-header {
            margin-bottom: 40px;
        }

        .page-header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .page-header p {
            color: var(--tmobile-light-gray);
            font-size: 1.1em;
        }

        .ads-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            margin-top: 30px;
        }

        .ad-card {
            background: var(--tmobile-dark-gray);
            border: 2px solid var(--tmobile-gray);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .ad-card:hover {
            border-color: var(--tmobile-magenta);
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(226, 0, 116, 0.3);
        }

        .ad-card.create-new {
            background: linear-gradient(135deg, rgba(226, 0, 116, 0.1) 0%, rgba(168, 0, 90, 0.1) 100%);
            border: 3px dashed var(--tmobile-magenta);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 400px;
        }

        .ad-card.create-new:hover {
            background: linear-gradient(135deg, rgba(226, 0, 116, 0.2) 0%, rgba(168, 0, 90, 0.2) 100%);
        }

        .create-new-content {
            text-align: center;
            padding: 40px;
        }

        .create-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }

        .create-new-content h3 {
            font-size: 1.5em;
            margin-bottom: 10px;
        }

        .create-new-content p {
            color: var(--tmobile-light-gray);
        }

        .ad-preview {
            width: 100%;
            height: 350px;
            object-fit: cover;
            background: var(--tmobile-black);
        }

        .ad-info {
            padding: 20px;
        }

        .ad-name {
            font-size: 1.2em;
            font-weight: 600;
            margin-bottom: 5px;
            color: var(--tmobile-white);
        }

        .ad-slogan {
            font-size: 0.9em;
            color: var(--tmobile-light-gray);
            margin-bottom: 10px;
        }

        .ad-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid var(--tmobile-gray);
        }

        .ad-date {
            font-size: 0.85em;
            color: var(--tmobile-gray);
        }

        .ad-actions {
            display: flex;
            gap: 10px;
        }

        .btn-icon {
            background: transparent;
            border: 1px solid var(--tmobile-gray);
            color: var(--tmobile-white);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s ease;
        }

        .btn-icon:hover {
            border-color: var(--tmobile-magenta);
            background: rgba(226, 0, 116, 0.1);
        }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--tmobile-light-gray);
        }

        .empty-state h2 {
            font-size: 2em;
            margin-bottom: 20px;
            color: var(--tmobile-white);
        }

        @media (max-width: 768px) {
            .ads-gallery {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="navbar-container">
            <a href="/" class="navbar-brand">
                <div>
                    <div class="navbar-logo">T-Mobile</div>
                    <div class="navbar-tagline">Ad System</div>
                </div>
            </a>
            <ul class="navbar-menu">
                <li><a href="/" class="navbar-link">Home</a></li>
                <li><a href="/my-ads.html" class="navbar-link active">My Ads</a></li>
                <li><a href="/my-biddings.html" class="navbar-link">My Biddings</a></li>
            </ul>
            <div class="user-info">
                <span class="user-display"></span>
                <a href="/login.html" class="btn-nav-login">Login</a>
                <button class="btn-nav-logout" onclick="signOutUser()">Logout</button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="my-ads-container">
        <div class="page-header">
            <h1>My Ads</h1>
            <p>Manage and preview all your created advertisements</p>
        </div>

        <div class="ads-gallery" id="adsGallery">
            <!-- Create New Card (Always First) -->
            <div class="ad-card create-new" onclick="window.location.href='/ad-generator.html'">
                <div class="create-new-content">
                    <div class="create-icon">+</div>
                    <h3>Create New Ad</h3>
                    <p>Design a new advertisement</p>
                </div>
            </div>

            <!-- Existing Ads (Loaded by JavaScript) -->
        </div>
    </div>

    <!-- Load Auth Script -->
    <script type="module" src="/js/auth.js"></script>
    <script type="module" src="/js/my-ads.js"></script>
</body>
</html>
