<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T-Mobile Ad System - Login</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        /* Login Page Specific Styles */
        .login-container {
            max-width: 450px;
            margin: 80px auto;
            padding: 0 20px;
        }

        .login-card {
            background: var(--tmobile-dark-gray);
            padding: 50px 40px;
            border-radius: 20px;
            border: 2px solid var(--tmobile-gray);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .login-header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #E20074 0%, #FF2D92 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .login-header p {
            color: var(--tmobile-light-gray);
            font-size: 1.1em;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--tmobile-white);
            font-weight: 500;
            font-size: 0.95em;
        }

        .form-group input {
            width: 100%;
        }

        .btn-full {
            width: 100%;
            margin-bottom: 15px;
        }

        .divider {
            text-align: center;
            margin: 30px 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: var(--tmobile-gray);
        }

        .divider span {
            background: var(--tmobile-dark-gray);
            padding: 0 15px;
            position: relative;
            color: var(--tmobile-gray);
            font-weight: 500;
        }

        .google-btn {
            background: white;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .google-btn:hover {
            background: #f1f1f1;
            color: #000;
        }

        .toggle-form {
            text-align: center;
            margin-top: 30px;
            color: var(--tmobile-light-gray);
        }

        .toggle-form a {
            color: var(--tmobile-magenta);
            text-decoration: none;
            font-weight: 600;
        }

        .toggle-form a:hover {
            color: var(--tmobile-light-magenta);
        }

        #signup-form {
            display: none;
        }

        @media (max-width: 768px) {
            .login-card {
                padding: 40px 30px;
            }

            .login-header h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="navbar-container">
            <a href="/" class="navbar-brand">
                <div>
                    <div class="navbar-logo">T-Mobile</div>
                    <div class="navbar-tagline">Ad System</div>
                </div>
            </a>
            <ul class="navbar-menu">
                <li><a href="/" class="navbar-link">Home</a></li>
                <li><a href="/my-ads.html" class="navbar-link">My Ads</a></li>
                <li><a href="/my-biddings.html" class="navbar-link">My Biddings</a></li>
            </ul>
            <div class="user-info">
                <span class="user-display"></span>
                <a href="/login.html" class="btn-nav-login">Login</a>
                <button class="btn-nav-logout" onclick="signOutUser()">Logout</button>
            </div>
        </div>
    </nav>

    <!-- Login Container -->
    <div class="login-container">
        <div class="login-card">
            <!-- Sign In Form -->
            <div id="signin-form">
                <div class="login-header">
                    <h1>Welcome Back</h1>
                    <p>Sign in to access your saved ads</p>
                </div>

                <form onsubmit="event.preventDefault(); signInWithEmail();">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" placeholder="your@email.com" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Enter your password" required>
                    </div>

                    <button type="submit" class="btn-primary btn-full">Sign In</button>
                </form>

                <div class="divider">
                    <span>OR</span>
                </div>

                <button onclick="signInWithGoogle()" class="btn-secondary google-btn btn-full">
                    <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
                        <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"></path>
                        <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.715H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"></path>
                        <path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"></path>
                        <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.159 6.656 3.58 9 3.58z" fill="#EA4335"></path>
                    </svg>
                    Sign in with Google
                </button>

                <div class="toggle-form">
                    Don't have an account? <a href="#" onclick="toggleForms(); return false;">Sign Up</a>
                </div>
            </div>

            <!-- Sign Up Form -->
            <div id="signup-form">
                <div class="login-header">
                    <h1>Create Account</h1>
                    <p>Join us and start creating amazing ads</p>
                </div>

                <form onsubmit="event.preventDefault(); signUpWithEmail();">
                    <div class="form-group">
                        <label for="signup-email">Email Address</label>
                        <input type="email" id="signup-email" placeholder="your@email.com" required>
                    </div>

                    <div class="form-group">
                        <label for="signup-password">Password</label>
                        <input type="password" id="signup-password" placeholder="Choose a strong password" required minlength="6">
                    </div>

                    <button type="submit" class="btn-primary btn-full">Create Account</button>
                </form>

                <div class="divider">
                    <span>OR</span>
                </div>

                <button onclick="signInWithGoogle()" class="btn-secondary google-btn btn-full">
                    <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
                        <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"></path>
                        <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.715H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"></path>
                        <path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"></path>
                        <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.159 6.656 3.58 9 3.58z" fill="#EA4335"></path>
                    </svg>
                    Sign up with Google
                </button>

                <div class="toggle-form">
                    Already have an account? <a href="#" onclick="toggleForms(); return false;">Sign In</a>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import './js/auth.js';

        // Toggle between sign in and sign up forms
        window.toggleForms = function() {
            const signinForm = document.getElementById('signin-form');
            const signupForm = document.getElementById('signup-form');

            if (signinForm.style.display === 'none') {
                signinForm.style.display = 'block';
                signupForm.style.display = 'none';
            } else {
                signinForm.style.display = 'none';
                signupForm.style.display = 'block';
            }
        };

        // Override auth functions to use correct input IDs
        window.signUpWithEmail = async function() {
            const { auth } = await import('./js/firebase-config.js');
            const { createUserWithEmailAndPassword } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js');

            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;

            if (!email || !password) {
                alert('Please enter email and password');
                return;
            }

            try {
                await createUserWithEmailAndPassword(auth, email, password);
                console.log('✅ Account created successfully');
                alert('Account created! Welcome!');
                window.location.href = '/ad-generator.html';
            } catch (error) {
                console.error('❌ Sign up error:', error);
                alert('Error: ' + error.message);
            }
        };
    </script>
</body>
</html>
